name: Bonsai de contribuicoes

on:
  schedule:
    - cron: '17 6 * * *' # diariamente as 06:17 UTC (03:17 em Brasilia)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  grow:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do perfil
        uses: actions/checkout@v4

      - name: Gerar e atualizar bonsai
        uses: egorthinks/git-bonsai@v1
        with:
          user: joaquim-antonio
          output-dir: output
          season: auto
